<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swan — New post</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</head>
<body>
<main class="wrap compose">
  <div class="pad">
    <div class="seg modern" id="typeSeg">
      <button data-type="post" class="active">📷&nbsp;Post</button>
      <button data-type="reel">🎬&nbsp;Reel</button>
      <button data-type="story">✦&nbsp;Story</button>
    </div>
  </div>

  <div class="pad">
    <div class="ccard">
      <div class="chead">Media</div>
      <label for="files" class="media-pick">
        <span class="mp-icon">＋</span>
        <span class="mp-text">Tap to add photos or video</span>
      </label>
      <input type="file" id="files" accept="image/*,video/*" multiple class="hidden">
      <div class="thumb-row" id="thumbs"></div>
    </div>
  </div>

  <div class="pad">
    <div class="ccard">
      <div class="chead">Caption</div>
      <textarea id="caption" maxlength="500" placeholder="Write a caption..."></textarea>
    </div>
  </div>

  <div class="pad">
    <div class="ccard">
      <div class="chead">♪ Music <span class="csub">optional</span></div>
    <div class="seg" id="musicTabs">
      <button data-mtab="audius" class="active">Audius</button>
      <button data-mtab="ext">Spotify / Apple Music</button>
    </div>

    <div id="mtab-audius">
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <input id="aq" placeholder="Search Audius tracks..." autocomplete="off" style="flex:1">
        <button class="btn btn-sm" id="asearch" style="width:auto">Search</button>
      </div>
      <div id="aresults"></div>
      <div id="asel"></div>
    </div>

    <div id="mtab-ext" class="hidden">
      <div class="seg" id="srcSeg">
        <button data-src="spotify" class="active">Spotify</button>
        <button data-src="apple">Apple Music</button>
        <button data-src="youtube">YouTube</button>
      </div>
      <div class="field"><label>Track link (or leave blank to link a search)</label><input id="xurl" placeholder="Paste track link here" autocomplete="off"></div>
      <div class="field"><label>Song title</label><input id="xtitle" placeholder="Song title" maxlength="120"></div>
      <div class="field"><label>Artist</label><input id="xartist" placeholder="Artist" maxlength="120"></div>
      <button class="btn btn-outline btn-sm" id="xattach" style="width:100%">Attach this track</button>
      <div id="xsel" style="margin-top:8px"></div>
      </div>
    </div>
  </div>

  <div class="pad">
    <div class="ccard">
      <div class="chead">Link cards <span class="csub">web · YouTube · Spotify — swipeable</span></div>
      <div id="cardPrev" class="thumb-row"></div>
      <div class="btn-row" style="margin-bottom:10px">
        <button class="btn btn-outline btn-sm" id="addWebBtn" type="button">🌐 Web link</button>
        <button class="btn btn-outline btn-sm" id="addYtBtn" type="button">▶ YouTube</button>
        <button class="btn btn-outline btn-sm" id="addSpBtn" type="button">♪ Spotify</button>
      </div>
      <div id="linkForm" class="hidden">
        <div class="field"><label id="lfUrlLbl">Link URL</label><input id="lfUrl" placeholder="https://..." autocomplete="off" inputmode="url"></div>
        <div class="field"><label>Title <span style="font-weight:400">(optional — we detect it)</span></label><input id="lfTitle" placeholder="Card title" maxlength="120"></div>
        <div class="btn-row">
          <button class="btn btn-sm" id="lfAdd" type="button">Add card</button>
          <button class="btn btn-outline btn-sm" id="lfCancel" type="button">Cancel</button>
        </div>
        <div id="lfErr" style="margin-top:8px"></div>
      </div>
    </div>
  </div>

  <div class="sharebar">
    <button class="btn-share" id="publish">Share</button>
    <div id="perr" style="margin-top:10px"></div>
  </div>
</main>
<script>
(function () {
  let me = null;
  let postType = "post";
  let music = null; // {source:'audius',id,title,artist,stream} | {source:'spotify'|'apple',title,artist,url}
  let extSource = "spotify";
  let files = [];

  function segWire(id, cb) {
    const seg = document.getElementById(id);
    seg.querySelectorAll("button").forEach(function (b) {
      b.addEventListener("click", function () {
        seg.querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
        b.classList.add("active");
        cb(b);
      });
    });
  }

  segWire("typeSeg", function (b) { postType = b.dataset.type; });
  segWire("musicTabs", function (b) {
    document.getElementById("mtab-audius").classList.toggle("hidden", b.dataset.mtab !== "audius");
    document.getElementById("mtab-ext").classList.toggle("hidden", b.dataset.mtab !== "ext");
  });
  segWire("srcSeg", function (b) { extSource = b.dataset.src; });

  // file previews
  const fileInput = document.getElementById("files");
  const thumbs = document.getElementById("thumbs");
  fileInput.addEventListener("change", function () {
    files = Array.from(fileInput.files || []);
    thumbs.innerHTML = "";
    files.forEach(function (f) {
      const url = URL.createObjectURL(f);
      const el = f.type.startsWith("video") ? document.createElement("video") : document.createElement("img");
      el.src = url; el.muted = true;
      thumbs.appendChild(el);
    });
  });

  /* ---------- Audius search ---------- */
  const aresults = document.getElementById("aresults");
  const asel = document.getElementById("asel");
  function fmtT(s) { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  function renderAudiusSel() {
    if (!(music && music.source === "audius")) { asel.innerHTML = ""; return; }
    let html = '<div class="track-row selected"><div class="grow"><div class="tt">' + esc(music.title) + '</div><div class="ta">' + esc(music.artist) + ' · Audius</div></div><button class="mini-btn" id="aclear">Remove</button></div>';
    if (music.trackDur && music.trackDur > 5) {
      const durs = [[15, "15s"], [30, "30s"], [60, "60s"], [null, "Full"]];
      html += '<div class="snip"><div class="snip-lab"><span>Snippet starts at <b id="snStartLbl">' + fmtT(music.start || 0) + '</b></span><span>' + fmtT(music.trackDur) + ' total</span></div>' +
        '<input type="range" id="snStart" min="0" max="' + Math.floor(music.trackDur) + '" value="' + Math.floor(music.start || 0) + '">' +
        '<div class="seg" id="snDur">' +
        durs.map(function (d) {
          const on = (music.dur || null) === d[0] ? " active" : "";
          return '<button data-d="' + (d[0] === null ? "" : d[0]) + '" class="' + on + '">' + d[1] + "</button>";
        }).join("") + "</div></div>";
    }
    asel.innerHTML = html;
    document.getElementById("aclear").onclick = function () { music = null; renderAudiusSel(); };
    const rng = document.getElementById("snStart");
    if (rng) rng.addEventListener("input", function () {
      music.start = parseFloat(rng.value) || 0;
      document.getElementById("snStartLbl").textContent = fmtT(music.start);
    });
    const seg = document.getElementById("snDur");
    if (seg) seg.querySelectorAll("button").forEach(function (b) {
      b.addEventListener("click", function () {
        music.dur = b.dataset.d ? parseFloat(b.dataset.d) : null;
        seg.querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
        b.classList.add("active");
      });
    });
  }
  async function audiusSearch() {
    const q = document.getElementById("aq").value.trim();
    if (!q) return;
    aresults.innerHTML = '<div class="sub" style="color:#a89c9c">Searching...</div>';
    try {
      const r = await fetch(AUDIUS_HOST + "/v1/tracks/search?query=" + encodeURIComponent(q) + "&app_name=" + encodeURIComponent(APP_NAME));
      if (!r.ok) throw new Error("Audius search failed (" + r.status + ")");
      const j = await r.json();
      const tracks = (j && j.data) || [];
      if (!tracks.length) { aresults.innerHTML = '<div class="sub" style="color:#a89c9c">No tracks found.</div>'; return; }
      let html = "";
      tracks.slice(0, 12).forEach(function (t, i) {
        const art = t.artwork && (t.artwork["150x150"] || t.artwork["480x480"] || t.artwork["1000x1000"]);
        const artist = (t.user && (t.user.name || t.user.handle)) || "Unknown artist";
        html += '<button class="track-row" data-i="' + i + '" style="width:100%;text-align:left;color:#f5f0f0">' +
          (art ? '<img src="' + esc(art) + '" alt="">' : "") +
          '<div class="grow"><div class="tt">' + esc(t.title || "Untitled") + '</div><div class="ta">' + esc(artist) + "</div></div></button>";
      });
      aresults.innerHTML = html;
      aresults.querySelectorAll(".track-row").forEach(function (b) {
        b.addEventListener("click", function () {
          const t = tracks[parseInt(b.dataset.i, 10)];
          const artist = (t.user && (t.user.name || t.user.handle)) || "Unknown artist";
          music = {
            source: "audius",
            id: String(t.id),
            title: t.title || "Untitled",
            artist: artist,
            stream: AUDIUS_HOST + "/v1/tracks/" + t.id + "/stream?app_name=" + encodeURIComponent(APP_NAME),
            trackDur: t.duration || null,
            start: 0,
            dur: null
          };
          renderAudiusSel();
          aresults.innerHTML = "";
        });
      });
    } catch (e) {
      aresults.innerHTML = '<div class="error-box">Music search failed: ' + esc(e.message || e) + "</div>";
    }
  }
  document.getElementById("asearch").addEventListener("click", audiusSearch);
  document.getElementById("aq").addEventListener("keydown", function (ev) { if (ev.key === "Enter") audiusSearch(); });

  /* ---------- Spotify / Apple Music attach ---------- */
  const xsel = document.getElementById("xsel");
  function renderExtSel() {
    if (music && (music.source === "spotify" || music.source === "apple" || music.source === "youtube")) {
      const lbl = music.source === "apple" ? "Apple Music" : music.source === "youtube" ? "YouTube" : "Spotify";
      let hint = "";
      if (music.source === "youtube") {
        hint = ytId(music.url)
          ? '<div class="detect-ok">✓ Video detected — it will play inside the post.</div>'
          : '<div class="detect-warn">⚠ Not a direct video link — inline play needs a youtube.com/watch?v=… or youtu.be/… link. Search links only open YouTube.</div>';
      } else if (music.source === "spotify") {
        hint = spId(music.url)
          ? '<div class="detect-ok">✓ Track detected — a preview will play inside the post.</div>'
          : '<div class="detect-warn">⚠ Not a direct track link — the preview needs an open.spotify.com/track/… link. Search links only open Spotify.</div>';
      }
      xsel.innerHTML = '<div class="track-row selected"><div class="grow"><div class="tt">' + esc(music.title) + '</div><div class="ta">' + esc(music.artist) + " · " + lbl + '</div></div><button class="mini-btn" id="xclear">Remove</button></div>' + hint;
      document.getElementById("xclear").onclick = function () { music = null; renderExtSel(); };
    } else { xsel.innerHTML = ""; }
  }
  document.getElementById("xattach").addEventListener("click", function () {
    const url = document.getElementById("xurl").value.trim();
    const title = document.getElementById("xtitle").value.trim();
    const artist = document.getElementById("xartist").value.trim();
    if (!title && !url) { alert("Add a song title or paste a track link."); return; }
    let finalUrl = url;
    if (!finalUrl) {
      const q = encodeURIComponent((title + " " + artist).trim());
      finalUrl = extSource === "apple"
        ? "https://music.apple.com/us/search?term=" + q
        : extSource === "youtube"
        ? "https://www.youtube.com/results?search_query=" + q
        : "https://open.spotify.com/search/" + q;
    }
    music = { source: extSource, title: title || "Shared track", artist: artist || "Unknown artist", url: finalUrl };
    renderExtSel();
  });

  /* ---------- link cards (web / YouTube / Spotify) ---------- */
  let cards = []; // {kind, url, title, subtitle, thumb}
  let linkKind = null;

  function renderCards() {
    const el = document.getElementById("cardPrev");
    el.innerHTML = "";
    cards.forEach(function (c, i) {
      const d = document.createElement("div");
      d.className = "cardchip";
      d.innerHTML =
        (c.thumb ? '<img src="' + esc(c.thumb) + '" alt="">' : '<span class="cc-ico">' + (c.kind === "youtube" ? "▶" : c.kind === "spotify" ? "♪" : "🌐") + "</span>") +
        '<span class="cc-t">' + esc(c.title || c.url) + '</span><button type="button" data-i="' + i + '" aria-label="Remove card">✕</button>';
      el.appendChild(d);
    });
    el.querySelectorAll("button").forEach(function (b) {
      b.addEventListener("click", function () { cards.splice(parseInt(b.dataset.i, 10), 1); renderCards(); });
    });
  }

  function openLinkForm(kind) {
    linkKind = kind;
    document.getElementById("lfUrl").value = "";
    document.getElementById("lfTitle").value = "";
    document.getElementById("lfErr").innerHTML = "";
    document.getElementById("lfUrlLbl").textContent =
      kind === "youtube" ? "YouTube video link" : kind === "spotify" ? "Spotify track link" : "Web link URL";
    document.getElementById("linkForm").classList.remove("hidden");
    document.getElementById("lfUrl").focus();
  }
  document.getElementById("addWebBtn").addEventListener("click", function () { openLinkForm("web"); });
  document.getElementById("addYtBtn").addEventListener("click", function () { openLinkForm("youtube"); });
  document.getElementById("addSpBtn").addEventListener("click", function () { openLinkForm("spotify"); });
  document.getElementById("lfCancel").addEventListener("click", function () {
    document.getElementById("linkForm").classList.add("hidden");
  });

  document.getElementById("lfAdd").addEventListener("click", async function () {
    const url = document.getElementById("lfUrl").value.trim();
    const typedTitle = document.getElementById("lfTitle").value.trim();
    const errBox = document.getElementById("lfErr");
    errBox.innerHTML = "";
    if (!/^https?:\/\//i.test(url)) { errBox.innerHTML = errHTML("Paste a full link starting with https://"); return; }
    const btn = this;
    btn.disabled = true;
    btn.textContent = "Detecting...";
    try {
      const card = { kind: linkKind, url: url, title: typedTitle, subtitle: "", thumb: "" };
      if (linkKind === "youtube") {
        const vid = ytId(url);
        if (!vid) throw new Error("That isn't a YouTube video link. Open the video in YouTube, tap Share → Copy link, and paste it here.");
        card.thumb = "https://i.ytimg.com/vi/" + vid + "/hqdefault.jpg";
        if (!typedTitle) {
          try {
            const r = await fetch("https://www.youtube.com/oembed?url=" + encodeURIComponent(url) + "&format=json");
            if (r.ok) { const j = await r.json(); card.title = j.title || ""; card.subtitle = j.author_name || "YouTube"; }
          } catch (e) { /* non-fatal */ }
        }
        if (!card.title) card.title = "YouTube video";
        if (!card.subtitle) card.subtitle = "YouTube";
      } else if (linkKind === "spotify") {
        const tid = spId(url);
        if (!tid) throw new Error("That isn't a Spotify track link. In Spotify, tap Share → Copy link on a song, and paste it here.");
        if (!typedTitle) {
          try {
            const r = await fetch("https://open.spotify.com/oembed?url=" + encodeURIComponent(url));
            if (r.ok) { const j = await r.json(); card.title = j.title || ""; card.subtitle = j.author_name || "Spotify"; card.thumb = j.thumbnail_url || ""; }
          } catch (e) { /* non-fatal */ }
        }
        if (!card.title) card.title = "Spotify track";
        if (!card.subtitle) card.subtitle = "Spotify";
      } else {
        let dom = url;
        try { dom = new URL(url).hostname.replace(/^www\./, ""); } catch (e) { /* keep raw */ }
        card.thumb = "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(dom) + "&sz=128";
        if (!card.title) card.title = dom;
        card.subtitle = dom;
      }
      cards.push(card);
      document.getElementById("linkForm").classList.add("hidden");
      renderCards();
    } catch (e) {
      errBox.innerHTML = errHTML(e);
    }
    btn.disabled = false;
    btn.textContent = "Add card";
  });

  /* ---------- publish ---------- */
  const perr = document.getElementById("perr");
  document.getElementById("publish").addEventListener("click", async function () {
    perr.innerHTML = "";
    if (!files.length) { perr.innerHTML = errHTML("Pick at least one photo or video first."); return; }
    const btn = this;
    btn.disabled = true;
    btn.textContent = "Publishing...";
    try {
      const caption = document.getElementById("caption").value.trim();
      const useFiles = postType === "post" ? files : files.slice(0, 1);
      const mediaUrls = [];
      for (const f of useFiles) {
        btn.textContent = "Uploading (" + (mediaUrls.length + 1) + "/" + useFiles.length + ")...";
        mediaUrls.push(await uploadMedia(me.id, f));
      }
      const row = {
        author_id: me.id,
        type: postType,
        caption: caption || null,
        media_urls: mediaUrls,
        music_track_id: music && music.source === "audius" ? music.id : null,
        music_title: music ? music.title : null,
        music_artist: music ? music.artist : null,
        music_stream_url: music && music.source === "audius" ? music.stream : null,
        music_source: music ? music.source : "audius",
        music_external_url: music && (music.source === "spotify" || music.source === "apple" || music.source === "youtube") ? music.url : null,
        music_start_sec: music && music.source === "audius" ? (music.start || 0) : 0,
        music_duration_sec: music && music.source === "audius" ? (music.dur || null) : null,
        attachments: cards
      };
      btn.textContent = "Publishing...";
      const { data: post, error: pErr } = await sb.from("posts").insert(row).select().single();
      if (pErr) throw pErr;
      window.location.href = "index.html";
    } catch (e) {
      perr.innerHTML = errHTML(e);
      btn.disabled = false;
      btn.textContent = "Publish";
    }
  });

  (async function init() {
    const user = await requireAuth();
    if (!user) return;
    const t0 = new URLSearchParams(window.location.search).get("type");
    if (t0 === "post" || t0 === "reel" || t0 === "story") {
      postType = t0;
      document.querySelectorAll("#typeSeg button").forEach(function (b) {
        b.classList.toggle("active", b.dataset.type === t0);
      });
    }
    topBar({ compose: false });
    bottomNav(null);
    me = await currentProfile();
    if (!me) { perr.innerHTML = errHTML("No profile found."); return; }
  })();
})();
</script>
</body>
</html>
