<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swan — Home</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</head>
<body>
<main class="wrap" id="main"></main>
<script>
(function () {
  const main = document.getElementById("main");
  let me = null;
  /* ---------- stories ---------- */
  let storyGroups = [];
  function openStory(ai, si) {
    const g = storyGroups[ai];
    const s = g.items[si];
    const ov = document.createElement("div");
    ov.className = "story-viewer";
    const media = isVideo(s.media_urls[0])
      ? '<video src="' + esc(s.media_urls[0]) + '" autoplay playsinline></video>'
      : '<img src="' + esc(s.media_urls[0]) + '" alt="story">';
    ov.innerHTML =
      '<div class="sv-head">' + avatarHTML(g.author.avatar_url, g.author.username, 34) +
      '<div class="who">' + esc(g.author.username) + ' <span style="color:#a89c9c;font-weight:400">· ' + timeAgo(s.created_at) + "</span></div>" +
      '<button class="sv-close" aria-label="Close">×</button></div>' +
      '<div class="sv-media">' + media + "</div>" +
      '<div class="sv-zones"><button data-go="-1" aria-label="Previous"></button><button data-go="1" aria-label="Next"></button></div>';
    document.body.appendChild(ov);
    document.body.style.overflow = "hidden";
    let timer = null;
    function close() { clearTimeout(timer); ov.remove(); document.body.style.overflow = ""; }
    function nav(d) {
      clearTimeout(timer);
      let nai = ai, nsi = si + d;
      if (nsi < 0) { nai = ai - 1; nsi = nai >= 0 ? storyGroups[nai].items.length - 1 : 0; }
      if (nai >= 0 && nsi >= storyGroups[nai].items.length) { nai = ai + 1; nsi = 0; }
      if (nai < 0 || nai >= storyGroups.length) { close(); return; }
      ov.remove(); document.body.style.overflow = "";
      openStory(nai, nsi);
    }
    ov.querySelector(".sv-close").onclick = close;
    ov.querySelectorAll(".sv-zones button").forEach(function (b) {
      b.onclick = function () { nav(parseInt(b.dataset.go, 10)); };
    });
    const vid = ov.querySelector("video");
    if (vid) { vid.onended = function () { nav(1); }; }
    else { timer = setTimeout(function () { nav(1); }, 6000); }
  }

  async function loadStories() {
    try {
      const since = new Date(Date.now() - 24 * 3600 * 1000).toISOString();
      const { data, error } = await sb.from("posts").select("*")
        .eq("type", "story").eq("archived", false).gte("created_at", since).order("created_at", { ascending: true }).limit(60);
      if (error) throw error;
      if (!data || !data.length) return "";
      const authorIds = [...new Set(data.map(function (s) { return s.author_id; }))];
      const { data: authors } = await sb.from("profiles").select("id,username,avatar_url").in("id", authorIds);
      const amap = {};
      (authors || []).forEach(function (a) { amap[a.id] = a; });
      storyGroups = [];
      const byAuthor = {};
      data.forEach(function (s) {
        if (!byAuthor[s.author_id]) { byAuthor[s.author_id] = []; }
        byAuthor[s.author_id].push(s);
      });
      let html = '<div class="stories-row">';
      html += '<a class="story-item" href="compose.html?type=story">' +
        '<span class="story-ring story-add"><span class="mp-icon">＋</span></span>' +
        '<span class="story-name">Your story</span></a>';
      let i = 0;
      Object.keys(byAuthor).forEach(function (aid) {
        const author = amap[aid] || { username: "?", avatar_url: null };
        storyGroups.push({ author: author, items: byAuthor[aid] });
        const idx = i++;
        html += '<button class="story-item" data-ai="' + idx + '">' +
          '<span class="story-ring">' + avatarHTML(author.avatar_url, author.username, 58) + "</span>" +
          '<span class="story-name">' + esc(author.username) + "</span></button>";
      });
      html += "</div>";
      return html;
    } catch (e) { return ""; }
  }

  async function init() {
    const user = await requireAuth();
    if (!user) return;
    topBar({});
    bottomNav("home");
    try {
      me = await currentProfile();
      if (!me) { main.innerHTML = errHTML("No profile found. Please sign up again."); return; }
      setME(me);

      const storiesHTML = await loadStories();

      const { data: f } = await sb.from("follows").select("following_id").eq("follower_id", me.id);
      const ids = [me.id].concat((f || []).map(function (x) { return x.following_id; }));
      const { data: posts, error: pErr } = await sb.from("posts").select("*")
        .in("author_id", ids).in("type", ["post", "reel"]).eq("archived", false)
        .order("created_at", { ascending: false }).limit(40);
      if (pErr) throw pErr;

      let feedHTML = "";
      if (!posts || !posts.length) {
        feedHTML = '<div class="empty"><div class="big">🪿</div>Your feed is quiet.<br>Grow your flock or <a href="compose.html" style="color:#a6262e;font-weight:700">share your first post</a>.</div>';
      } else {
        const postIds = posts.map(function (p) { return p.id; });
        const authorIds = [...new Set(posts.map(function (p) { return p.author_id; }))];
        const { data: authors } = await sb.from("profiles").select("id,username,avatar_url").in("id", authorIds);
        const amap = {};
        (authors || []).forEach(function (a) { amap[a.id] = a; });

        const { data: likes } = await sb.from("likes").select("post_id").in("post_id", postIds);
        const likeCount = {};
        (likes || []).forEach(function (l) { likeCount[l.post_id] = (likeCount[l.post_id] || 0) + 1; });
        const { data: myLikes } = await sb.from("likes").select("post_id").eq("user_id", me.id).in("post_id", postIds);
        const likedSet = {};
        (myLikes || []).forEach(function (l) { likedSet[l.post_id] = 1; });

        const { data: comments } = await sb.from("comments")
          .select("id,post_id,body,created_at,author_id").in("post_id", postIds)
          .order("created_at", { ascending: false }).limit(120);
        const commentsByPost = {};
        (comments || []).forEach(function (c) {
          if (!commentsByPost[c.post_id]) commentsByPost[c.post_id] = [];
          if (commentsByPost[c.post_id].length < 2) commentsByPost[c.post_id].push(c);
        });
        const commentAuthorIds = [...new Set((comments || []).map(function (c) { return c.author_id; }))];
        let camap = {};
        if (commentAuthorIds.length) {
          const { data: ca } = await sb.from("profiles").select("id,username").in("id", commentAuthorIds);
          (ca || []).forEach(function (a) { camap[a.id] = a; });
        }

        posts.forEach(function (p) {
          const author = amap[p.author_id] || { username: "?", avatar_url: null };
          const cmts = (commentsByPost[p.id] || []).slice().reverse();
          feedHTML += cardHTML(p, author, likeCount[p.id] || 0, !!likedSet[p.id], cmts, camap);
        });
      }

      main.innerHTML = storiesHTML + feedHTML;

      wirePostCard(main);
      initFeedAutoplay(main);
      main.querySelectorAll(".story-item").forEach(function (b) {
        b.addEventListener("click", function () { openStory(parseInt(b.dataset.ai, 10), 0); });
      });
      document.addEventListener("postschanged", function (e) {
        if (e.detail.act === "media-added") { window.location.reload(); return; }
        const card = document.getElementById("post-" + e.detail.id);
        if (card && (e.detail.act === "archive" || e.detail.act === "delete")) card.remove();
      });
    } catch (e) {
      main.innerHTML = errHTML(e);
    }
  }
  init();
})();
</script>
</body>
</html>
