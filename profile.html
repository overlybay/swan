<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swan — Profile</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</head>
<body>
<main class="wrap" id="main"></main>
<script>
(function () {
  const main = document.getElementById("main");
  const params = new URLSearchParams(window.location.search);
  const uname = params.get("u");
  let me = null;
  let prof = null;
  let isSelf = false;
  let activeTab = "posts";

  function tileHTML(p, tag) {
    const u = (p.media_urls && p.media_urls[0]) || "";
    const inner = isVideo(u)
      ? '<video src="' + esc(u) + '" preload="metadata" muted playsinline></video>'
      : '<img src="' + esc(u) + '" alt="" loading="lazy">';
    return '<a href="post.html?id=' + p.id + '">' + inner + (tag ? '<span class="reel-tag">' + tag + "</span>" : "") + "</a>";
  }

  async function render() {
    try {
      const [postsRes, reelsRes, followersRes, followingRes, archivedRes] = await Promise.all([
        sb.from("posts").select("id,media_urls").eq("author_id", prof.id).eq("type", "post").eq("archived", false).order("created_at", { ascending: false }),
        sb.from("posts").select("id,media_urls").eq("author_id", prof.id).eq("type", "reel").eq("archived", false).order("created_at", { ascending: false }),
        sb.from("follows").select("*", { count: "exact", head: true }).eq("following_id", prof.id),
        sb.from("follows").select("*", { count: "exact", head: true }).eq("follower_id", prof.id),
        sb.from("posts").select("id,media_urls,type,created_at").eq("author_id", prof.id).eq("archived", true).order("created_at", { ascending: false })
      ]);
      if (postsRes.error) throw postsRes.error;
      const posts = postsRes.data || [];
      const reels = reelsRes.data || [];
      const archived = archivedRes.data || [];
      const followers = followersRes.count || 0;
      const following = followingRes.count || 0;

      let following2 = false;
      if (!isSelf) {
        const { data: f } = await sb.from("follows").select("follower_id")
          .eq("follower_id", me.id).eq("following_id", prof.id).maybeSingle();
        following2 = !!f;
      }

      let html = '<div class="profile-head">' +
        '<div class="profile-top">' + avatarHTML(prof.avatar_url, prof.username, 76) +
          '<div class="profile-id"><h2>' + esc(prof.username) + '</h2><div class="dname">' + esc(prof.display_name || "") + "</div></div>" +
        "</div>" +
        '<div class="counts"><div><b>' + posts.length + "</b><span>posts</span></div>" +
        "<div><b>" + (followers + following) + "</b><span>flock</span></div></div>" +
        (prof.bio ? '<div class="bio">' + esc(prof.bio) + "</div>" : "") +
        '<div class="profile-actions">';
      if (isSelf) {
        html += '<a class="btn btn-outline" href="settings.html">Edit profile</a>';
        html += '<a class="btn btn-outline" href="compose.html">＋ New post</a>';
      } else {
        html += '<button class="btn ' + (following2 ? "btn-outline" : "") + '" id="followBtn">' + (following2 ? "✓ Flock" : "＋ Flock") + "</button>";
        html += '<button class="btn btn-outline" id="msgBtn">Message</button>';
      }
      html += "</div></div>";

      html += '<div class="tabs">' +
        '<button data-tab="posts"' + (activeTab === "posts" ? ' class="active"' : "") + ">Posts</button>" +
        '<button data-tab="reels"' + (activeTab === "reels" ? ' class="active"' : "") + ">Reels</button>" +
        (isSelf ? '<button data-tab="archived"' + (activeTab === "archived" ? ' class="active"' : "") + ">Archived</button>" : "") +
        '</div><div id="tabBody"></div>';
      main.innerHTML = html;

      main.querySelectorAll(".tabs button").forEach(function (b) {
        b.addEventListener("click", function () { activeTab = b.dataset.tab; render(); });
      });

      const body = document.getElementById("tabBody");
      if (activeTab === "posts") {
        body.innerHTML = posts.length
          ? '<div class="grid3">' + posts.map(function (p) { return tileHTML(p, null); }).join("") + "</div>"
          : '<div class="empty"><div class="big">📷</div>No posts yet.</div>';
      } else if (activeTab === "reels") {
        body.innerHTML = reels.length
          ? '<div class="grid3">' + reels.map(function (p) { return tileHTML(p, "🎬"); }).join("") + "</div>"
          : '<div class="empty"><div class="big">🎬</div>No reels yet.</div>';
      } else if (activeTab === "archived" && isSelf) {
        body.innerHTML = archived.length
          ? archived.map(function (p) {
              const u = (p.media_urls && p.media_urls[0]) || "";
              return '<div class="arch-row">' +
                (u ? '<img src="' + esc(u) + '" alt="">' : "") +
                '<div class="grow"><div class="t">' + (p.type === "reel" ? "🎬 Reel" : p.type === "story" ? "✦ Story" : "📷 Post") + '</div><div class="s">' + timeAgo(p.created_at) + "</div></div>" +
                '<div class="ops"><button class="mini-btn" data-unarch="' + p.id + '">Restore</button>' +
                '<button class="mini-btn" data-delarch="' + p.id + '">Delete</button></div></div>';
            }).join("")
          : '<div class="empty"><div class="big">📦</div>Nothing archived.<br>Use the ··· menu on your posts to archive them.</div>';
        body.querySelectorAll("[data-unarch]").forEach(function (b) {
          b.addEventListener("click", async function () {
            try { await archivePost(b.dataset.unarch, false); render(); }
            catch (e) { alert(e.message || e); }
          });
        });
        body.querySelectorAll("[data-delarch]").forEach(function (b) {
          b.addEventListener("click", async function () {
            if (!confirm("Delete this post permanently?")) return;
            try { await deletePost(b.dataset.delarch); render(); }
            catch (e) { alert(e.message || e); }
          });
        });
      }

      const fb = document.getElementById("followBtn");
      if (fb) fb.addEventListener("click", async function () {
        fb.disabled = true;
        try {
          if (following2) {
            await sb.from("follows").delete().eq("follower_id", me.id).eq("following_id", prof.id);
          } else {
            await sb.from("follows").insert({ follower_id: me.id, following_id: prof.id });
          }
          render();
        } catch (e) { alert("Could not update flock: " + (e.message || e)); fb.disabled = false; }
      });
      const mb = document.getElementById("msgBtn");
      if (mb) mb.addEventListener("click", async function () {
        mb.disabled = true;
        try { await openConversation(me.id, prof.id); }
        catch (e) { alert("Could not open chat: " + (e.message || e)); mb.disabled = false; }
      });
    } catch (e) { main.innerHTML = errHTML(e); }
  }

  (async function init() {
    const user = await requireAuth();
    if (!user) return;
    topBar({});
    bottomNav(uname ? null : "profile");
    try {
      me = await currentProfile();
      if (!me) { main.innerHTML = errHTML("No profile found."); return; }
      if (uname) {
        const { data, error } = await sb.from("profiles").select("*").eq("username", uname).single();
        if (error) throw new Error("User not found.");
        prof = data;
      } else {
        prof = me;
      }
      isSelf = prof.id === me.id;
      document.title = "Swan — @" + prof.username;
      render();
    } catch (e) { main.innerHTML = errHTML(e); }
  })();
})();
</script>
</body>
</html>
